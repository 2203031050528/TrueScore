# Render blueprint for the Django API (free web service). Database is Supabase Postgres (not Render's,
# which expires after 30 days); Redis is Upstash. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: truescore-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 30 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/internal/warmup
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: INTERNAL_CRON_SECRET
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. truescore-api.onrender.com
      - key: DATABASE_URL
        sync: false # Supabase connection string (use the pooler, sslmode=require)
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # https://<your-frontend-domain>
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false # https://<your-frontend-domain>, for Safe Exam Browser hashes
      - key: TRUSTED_PROXY_COUNT
        value: "2" # Vercel rewrite + Render load balancer
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_READ_ACCESS_KEY_ID
        sync: false
      - key: R2_READ_SECRET_ACCESS_KEY
        sync: false
      - key: R2_WRITE_ACCESS_KEY_ID
        sync: false
      - key: R2_WRITE_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
